name: YouTube Liveスナップショット収集

on:
  schedule:
    # 毎時38分。Twitch側(23分)ともずらして、同時に待ち行列へ
    # 入らないようにしている
    - cron: "38 * * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: スナップショットAPIを呼び出す
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/youtube-snapshot"
