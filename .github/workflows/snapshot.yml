name: Twitchスナップショット収集

on:
  schedule:
    # 毎時23分。「0分」は世界中のジョブが集中してGitHub側で
    # 遅延・スキップされやすいため、あえて半端な時刻にしている
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: スナップショットAPIを呼び出す
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/snapshot"
