name: Twitchスナップショット収集

on:
  # 定期実行は Cloudflare Workers の Cron Triggers（cron-worker/）に移した。
  # GitHub の schedule は混雑時に飛ばされ、毎時のはずが4〜6時間おきだったため。
  # ここは手動で1回だけ収集したいとき用に残している
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: スナップショットAPIを呼び出す
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/snapshot"
