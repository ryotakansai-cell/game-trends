name: 定期実行の自動停止を防ぐ

# 公開リポジトリでは、60日間コミットが無いと schedule の定期実行が
# 通知なしで止まる。止まるとスナップショットの収集が途切れ、
# ランキングの履歴に穴が開くので、しばらく開発が無いときだけ空コミットを入れる。
#
# 毎月決め打ちでコミットしないのは、push のたびに Vercel が
# 作り直しを始めるのと、開発中は履歴を汚す必要が無いため。

on:
  schedule:
    # 毎週月曜 3:07（UTC）。45日の判定を週1で見るので、
    # 遅くとも52日目にはコミットが入り、60日に届かない
    - cron: "7 3 * * 1"
  workflow_dispatch:

# 空コミットを push するために書き込みの許可が要る
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 最後のコミットから45日たっていれば空コミットを入れる
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "最後のコミットから ${days} 日"
          if [ "$days" -lt 45 ]; then
            echo "まだ余裕があるので何もしない"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "定期実行の自動停止を防ぐための空コミット"
          git push
